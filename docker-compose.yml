version: '3.9'

services:

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: jobhunt_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"

  web:
    build: .
    restart: always
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  celery:
    build: .
    restart: always
    command: celery -A core worker --loglevel=info --pool=solo
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
    volumes:
      - media_volume:/app/media
    depends_on:
      - web
      - redis

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
      - frontend

volumes:
  mysql_data:
  static_volume:
  media_volume: